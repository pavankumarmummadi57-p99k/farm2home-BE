spring.application.name=farm2home


# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/farm2home_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata

spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=8080

jwt.secret=Farm2HomeJwtSecretKeyForDevelopment2026SpringBootProjectSecureKey123456
jwt.expiration=86400000